<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - RBM System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        
        .button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .result h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .result p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .credentials p {
            margin: 8px 0;
            font-family: 'Courier New', monospace;
        }
        
        .credentials strong {
            color: #667eea;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .warning strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        
        <div class="header">
            <h1>Reset Admin Password</h1>
            <p>RBM System - Railway Deployment</p>
        </div>
        
        <div class="warning">
            <strong>⚠️ Perhatian:</strong>
            Endpoint ini hanya tersedia jika ENABLE_DEBUG=true di environment variables.
        </div>
        
        <button class="button" onclick="resetPassword()" id="resetBtn">
            Reset Password Admin
        </button>
        
        <div class="result" id="result"></div>
    </div>
    
    <script>
        async function resetPassword() {
            const btn = document.getElementById('resetBtn');
            const result = document.getElementById('result');
            
            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Resetting...';
            result.style.display = 'none';
            
            try {
                const response = await fetch('/api/debug/reset-admin-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>✅ Password Reset Berhasil!</h3>
                        <p>Admin password telah direset dengan sukses.</p>
                        <div class="credentials">
                            <p><strong>Username:</strong> ${data.credentials.username}</p>
                            <p><strong>Password:</strong> ${data.credentials.password}</p>
                            <p><strong>Apps:</strong> ${data.credentials.apps.join(', ')}</p>
                            <p><strong>Verified:</strong> ${data.verified ? '✅ Yes' : '❌ No'}</p>
                        </div>
                        <p style="margin-top: 15px;">
                            <a href="/login" style="color: #667eea; text-decoration: none; font-weight: 600;">
                                → Pergi ke halaman Login
                            </a>
                        </p>
                    `;
                } else {
                    throw new Error(data.error || 'Reset password gagal');
                }
                
                result.style.display = 'block';
                
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                    <p style="margin-top: 10px; font-size: 12px;">
                        Pastikan ENABLE_DEBUG=true di Railway environment variables.
                    </p>
                `;
                result.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Reset Password Admin';
            }
        }
    </script>
</body>
</html>
