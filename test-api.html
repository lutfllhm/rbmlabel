<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API - RBM System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .test-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .success {
            border-color: #28a745;
            background: #d4edda;
        }
        
        .error {
            border-color: #dc3545;
            background: #f8d7da;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Test API Endpoints - RBM System</h1>
        
        <!-- Test 1: Health Check -->
        <div class="test-section">
            <h2>1. Health Check</h2>
            <button onclick="testHealth()">Test /api/health</button>
            <div id="health-result" class="result" style="display: none;"></div>
        </div>
        
        <!-- Test 2: Test Endpoint -->
        <div class="test-section">
            <h2>2. Test Endpoint</h2>
            <button onclick="testApi()">Test /api/test</button>
            <div id="test-result" class="result" style="display: none;"></div>
        </div>
        
        <!-- Test 3: Routes List -->
        <div class="test-section">
            <h2>3. List All Routes</h2>
            <button onclick="testRoutes()">Test /api/routes</button>
            <div id="routes-result" class="result" style="display: none;"></div>
        </div>
        
        <!-- Test 4: Login Endpoint -->
        <div class="test-section">
            <h2>4. Login Endpoint</h2>
            <div class="input-group">
                <label>Username:</label>
                <input type="text" id="username" value="admin">
            </div>
            <div class="input-group">
                <label>Password:</label>
                <input type="password" id="password" value="iware123">
            </div>
            <div class="input-group">
                <label>App:</label>
                <input type="text" id="app" value="material">
            </div>
            <button onclick="testLogin()">Test /api/auth/login</button>
            <div id="login-result" class="result" style="display: none;"></div>
        </div>
        
        <!-- Test 5: Reset Admin -->
        <div class="test-section">
            <h2>5. Reset Admin Password</h2>
            <button onclick="testResetAdmin()">Test /api/debug/reset-admin-password</button>
            <div id="reset-result" class="result" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Loading...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }
        
        async function testApi() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Loading...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('/api/test');
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }
        
        async function testRoutes() {
            const resultDiv = document.getElementById('routes-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Loading...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('/api/routes');
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }
        
        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Loading...';
            resultDiv.className = 'result';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const app = document.getElementById('app').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, app })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = 'SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'FAILED (Status: ' + response.status + ')\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message + '\n\nMake sure the server is running and /api/auth/login endpoint exists.';
            }
        }
        
        async function testResetAdmin() {
            const resultDiv = document.getElementById('reset-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Loading...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch('/api/debug/reset-admin-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = 'SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = 'FAILED (Status: ' + response.status + ')\n\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Error: ' + error.message + '\n\nMake sure ENABLE_DEBUG=true in Railway Variables.';
            }
        }
    </script>
</body>
</html>
